name: Deploy Interactive Design Studio

on:
  push:
    branches:
      - exec/interactive-design-studio-zed-20260923
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: interactive-design-studio
    steps:
      - name: Checkout studio branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: interactive-design-studio/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build studio
        run: npm run build

      # Keep a downloadable build even if Pages enablement is unavailable to this integration.
      - name: Upload independent build artifact
        uses: actions/upload-artifact@v4
        with:
          name: micro-studio-built-site
          path: interactive-design-studio/dist

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: interactive-design-studio/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
