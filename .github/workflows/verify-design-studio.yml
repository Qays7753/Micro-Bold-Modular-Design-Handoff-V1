name: Verify Micro Design Studio V2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: interactive-design-studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: interactive-design-studio/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Preserve built studio
        uses: actions/upload-artifact@v4
        with:
          name: micro-design-studio-v2
          path: interactive-design-studio/dist
